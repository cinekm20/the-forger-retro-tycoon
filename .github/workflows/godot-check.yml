name: Godot project sanity check

on:
  push:
    paths:
      - "game/**"
      - ".github/workflows/godot-check.yml"
  pull_request:
    paths:
      - "game/**"

jobs:
  boot-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache Godot binary
        id: godot-cache
        uses: actions/cache@v6
        with:
          path: /usr/local/bin/godot
          key: godot-4.7.1-stable-linux-x86_64

      - name: Download Godot 4.7.1 headless binary
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64
          sudo mv Godot_v4.7.1-stable_linux.x86_64 /usr/local/bin/godot

      # On a completely fresh checkout, .godot/ (gitignored) doesn't exist yet,
      # so Godot hasn't built global_script_class_cache.cfg — the index of
      # every `class_name X` script in the project. Without it, ordinary
      # scripts referencing a global class (e.g. ScreenHelpers) by name fail
      # to parse with "Identifier not declared in the current scope", even
      # though the exact same project boots fine in the editor (which builds
      # this cache automatically the first time you open it). --import does
      # a full project scan/import and exits, building that cache, without
      # actually running anything — must run before any other headless step.
      - name: Import project (builds class_name cache for a fresh checkout)
        working-directory: game
        run: timeout 60 godot --headless --import --path .

      # Booting the project headless forces Godot to parse project.godot,
      # every autoload, and the main scene. GDScript parse errors, missing
      # autoload paths, or broken scene/script references surface here as
      # non-zero exit / stderr output instead of only being caught by
      # opening the editor by hand.
      - name: Boot project headless (surfaces script/scene errors)
        working-directory: game
        run: |
          timeout 60 godot --headless --quit --path . 2>&1 | tee godot_output.log
          if grep -Ei "SCRIPT ERROR|Parse Error|Cannot get class|Failed to load script" godot_output.log; then
            echo "Godot reported script/scene errors above."
            exit 1
          fi

      # Runs game/tests/run_tests.tscn — real assertions against the actual
      # autoloads (not just "does it boot"), see run_tests.gd for what's
      # covered. Passing the scene as a plain positional argument (not
      # --script) makes Godot boot the project normally — autoloads and
      # all — before running it, same as booting the real game; --script
      # is documented as "run a script without needing a project" and
      # skips that boot, so autoloads (Cities, Calendar, ...) aren't
      # available as global identifiers under it.
      - name: Run test suite (tests/run_tests.tscn)
        working-directory: game
        run: |
          timeout 60 godot --headless --path . res://tests/run_tests.tscn 2>&1 | tee tests_output.log
          exit_code=${PIPESTATUS[0]}
          if [ "$exit_code" -ne 0 ]; then
            echo "Test suite reported failures above (exit code $exit_code)."
            exit 1
          fi
