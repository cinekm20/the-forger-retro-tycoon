name: Android release AAB build

# Ręczne uruchomienie (workflow_dispatch) — ten build wymaga sekretów
# keystore release i produkuje plik do wgrania na Google Play, więc nie ma
# uruchamiać się automatycznie przy każdym pushu (patrz android-build.yml
# dla szybkich debug .apk, ten sam powód).
on:
  workflow_dispatch:

# contents: write — workflow commituje z powrotem podbite version/name po
# udanym buildzie (patrz krok "Bump version/name..." niżej), domyślny
# GITHUB_TOKEN bez tego miałby tylko odczyt.
permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.1-stable
  GODOT_TEMPLATES_DIR: 4.7.1.stable

jobs:
  build-android-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate sdkmanager
        id: sdkmanager
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER_PATH=$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -z "$SDKMANAGER_PATH" ]; then
            echo "Nie znaleziono sdkmanager w $ANDROID_HOME" >&2
            exit 1
          fi
          echo "Znaleziono: $SDKMANAGER_PATH"
          echo "bin_dir=$(dirname "$SDKMANAGER_PATH")" >> "$GITHUB_OUTPUT"

      - name: Ensure required Android SDK packages
        run: |
          export PATH="${{ steps.sdkmanager.outputs.bin_dir }}:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Cache Godot binary
        id: godot-cache
        uses: actions/cache@v6
        with:
          path: /usr/local/bin/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot headless binary
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x Godot_v${{ env.GODOT_VERSION }}_linux.x86_64
          sudo mv Godot_v${{ env.GODOT_VERSION }}_linux.x86_64 /usr/local/bin/godot

      - name: Cache export templates
        id: templates-cache
        uses: actions/cache@v6
        with:
          path: ~/.local/share/godot/export_templates/${{ env.GODOT_TEMPLATES_DIR }}
          key: godot-export-templates-${{ env.GODOT_VERSION }}

      - name: Download export templates
        if: steps.templates-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates/${{ env.GODOT_TEMPLATES_DIR }}
          unzip -q templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* ~/.local/share/godot/export_templates/${{ env.GODOT_TEMPLATES_DIR }}/

      # Odpowiednik menu "Project > Install Android Build Template" z edytora
      # (niedostępnego w trybie headless) — dokładnie ten sam plik
      # (android_source.zip z paczki export templates) rozpakowany w to samo
      # miejsce (game/android/build), które normalnie tworzy ta akcja w GUI.
      # Wymagane, bo gradle_build/use_gradle_build=true (preset "Android
      # Release") nie zadziała bez gotowego projektu Gradle pod tą ścieżką.
      - name: Install Android Gradle build template
        working-directory: game
        run: |
          mkdir -p android/build
          unzip -q -o ~/.local/share/godot/export_templates/${{ env.GODOT_TEMPLATES_DIR }}/android_source.zip -d android/build

      # Klucz release z sekretów repo (Settings > Secrets and variables >
      # Actions), NIE z pliku w repo — patrz komentarz w export_presets.cfg
      # przy preset.2. ANDROID_RELEASE_KEYSTORE_BASE64 to `base64 -w0
      # release.keystore` całego pliku .keystore/.jks.
      - name: Decode release keystore
        run: |
          echo "${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "${{ runner.temp }}/release.keystore"

      - name: Configure Godot editor settings
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres << EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          EOF

      - name: Import project (builds class_name cache)
        working-directory: game
        run: timeout 180 godot --headless --import --path .

      # version/code w export_presets.cfg (numer, po którym Google Play
      # rozpoznaje "nowszy" upload — musi zawsze rosnąć) NIE jest ręcznie
      # bumpowany w repo. Zamiast tego każdy przebieg tego workflow nadpisuje
      # go numerem uruchomienia GitHub Actions (github.run_number) — zawsze
      # unikalny i rosnący, więc każdy build z automatu jest "nowszą wersją"
      # dla Play. Nadpisuje TYLKO w tej efemerycznej kopii repo na runnerze
      # (nic nie jest commitowane z powrotem) — ta sama linia istnieje też w
      # preset.1 (debug .apk), ale ten workflow jej nie używa, więc
      # nadpisanie obu na raz jest nieszkodliwe.
      - name: Bump release version code to this workflow run's number
        working-directory: game
        run: sed -i -E "s/version\/code=[0-9]+/version\/code=${{ github.run_number }}/" export_presets.cfg

      - name: Export Android release AAB
        working-directory: game
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ runner.temp }}/release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_RELEASE_KEYSTORE_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p ../android_build
          timeout 600 godot --headless --export-release "Android Release" ../android_build/the-forger-release.aab --path . 2>&1 | tee export_output.log
          exit_code=${PIPESTATUS[0]}
          if [ "$exit_code" -ne 0 ] || [ ! -f ../android_build/the-forger-release.aab ]; then
            echo "Eksport nie powiódł się (kod $exit_code) albo plik .aab nie powstał."
            exit 1
          fi

      - name: Remove decoded keystore
        if: always()
        run: rm -f "${{ runner.temp }}/release.keystore"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: the-forger-release-aab
          path: android_build/the-forger-release.aab

      # Podbija PATCH (ostatnią liczbę X.Y.Z) version/name w preset.2.options
      # o 1 i commituje z powrotem do repo — TYLKO po udanym buildzie (jeśli
      # eksport wyżej zawiedzie, cały job się zatrzymuje i te kroki się nie
      # wykonują). Ten build użył jeszcze STAREJ wersji (np. 0.1.0) — bump
      # przygotowuje NASTĘPNY numer (0.1.1) na kolejne uruchomienie. Duży
      # skok (np. 0.1.x -> 0.2.0) zostaje ręczny — to decyzja produktowa, nie
      # coś do zgadywania automatem.
      - name: Bump version/name for next release build
        working-directory: game
        run: |
          python3 - <<'PYEOF'
          import re

          path = "export_presets.cfg"
          with open(path, encoding="utf-8") as f:
              content = f.read()

          def bump(m):
              major, minor, patch = m.group(1), m.group(2), int(m.group(3))
              return f'version/name="{major}.{minor}.{patch + 1}"'

          def patch_section(sec_match):
              return re.sub(r'version/name="(\d+)\.(\d+)\.(\d+)"', bump, sec_match.group(0), count=1)

          new_content = re.sub(r"\[preset\.2\.options\](?:\n(?!\[).*)*", patch_section, content)
          with open(path, "w", encoding="utf-8") as f:
              f.write(new_content)
          PYEOF
          grep 'version/name' export_presets.cfg

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/export_presets.cfg
          if git diff --cached --quiet; then
            echo "Brak zmian do commitowania."
          else
            git commit -m "ci: podbij version/name po udanym release build #${{ github.run_number }}"
            git push origin HEAD:${{ github.ref_name }}
          fi
