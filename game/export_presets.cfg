; Drugi preset Android — build RELEASE pod Google Play, osobny od preset.1
; wyżej (ten zostaje do szybkich debug .apk instalowanych ręcznie na telefon,
; patrz .github/workflows/android-build.yml). Play wymaga .aab, nie .apk, i
; wymaga gradle_build (nie da się zbudować .aab przez "legacy"/wbudowany
; eksporter Godota — stąd use_gradle_build=true tylko tutaj, nie w preset.1,
; żeby nie spowalniać/komplikować szybkich debug buildów). Klucz release
; (keystore/release, keystore/release_user, keystore/release_password)
; CELOWO nie jest tu zapisany — Godot czyta go z osobnych zmiennych
; środowiskowych GODOT_ANDROID_KEYSTORE_RELEASE_PATH/_USER/_PASSWORD (patrz
; .github/workflows/android-release-build.yml), żeby hasło/ścieżka do klucza
; nigdy nie trafiły do repo. version/code (1 poniżej) jest tylko wartością
; startową/fallbackiem dla eksportu lokalnego z edytora — workflow CI
; (android-release-build.yml) automatycznie nadpisuje ją numerem
; uruchomienia GitHub Actions przy KAŻDYM buildzie, więc Play zawsze widzi
; wyższy numer bez ręcznego bumpowania tego pliku.

[preset.2]

name="Android Release"
platform="Android"
runnable=false
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="../android_build/the-forger-release.aab"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.2.options]

custom_template/debug=""
custom_template/release=""
gradle_build/use_gradle_build=true
gradle_build/export_format=1
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
version/code=1
version/name="0.1.2"
package/unique_name="com.cinekm20.theforgerretrotycoon"
package/name="The Forger: Retro Tycoon"
package/signed=true
screen/immersive_mode=true
screen/support_small=true
screen/support_normal=true
screen/support_large=true
