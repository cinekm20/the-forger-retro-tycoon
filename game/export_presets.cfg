; Startowa konfiguracja eksportu (Web + Android). Wygenerowana ręcznie jako
; punkt wyjścia — przy pierwszym otwarciu Project > Export w Godocie 4.7+
; silnik może dopisać/poprawić brakujące klucze specyficzne dla Twojej
; wersji edytora. Przed publikacją zmień package/unique_name (Android) na
; własną, unikalną nazwę domenową (odwróconą), np. com.twojafirma.forger.

[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="../web_build/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

