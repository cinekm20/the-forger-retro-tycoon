# Play Core (com.google.android.play:app-update) ściąga tranzytywnie
# zależności AndroidX (androidx.fragment/androidx.core/... — patrz błąd CI:
# ":mapReleaseSourceSetPaths ... Configuration ':releaseRuntimeClasspath'
# contains AndroidX dependencies, but the 'android.useAndroidX' property is
# not enabled"). Bez tego AGP odmawia budowy modułu zależnego od AndroidX.
android.useAndroidX=true
# BEZ enableJetifier — wszystkie zależności Play Core w tym drzewie mają już
# prawdziwe groupId androidx.* (nie stary com.android.support), więc
# jetifikacja niczego by nie zmieniła, a WŁĄCZONA próbowała (bez potrzeby)
# jetifikować też godot-4.7.1.stable.aar (compileOnly, duży plik) i wywalała
# się na "Java heap space" w :extractReleaseAnnotations — zgłoszony błąd CI.
# org.gradle.jvmargs poniżej to dodatkowy, niezależny zapas na wypadek innych
# ciężkich transformacji w przyszłości (domyślny heap demona Gradle na
# runnerach GitHub Actions bywa zbyt mały dla większych drzew zależności).
org.gradle.jvmargs=-Xmx2g
