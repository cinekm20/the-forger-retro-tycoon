# Play Core (com.google.android.play:app-update) ściąga tranzytywnie
# zależności AndroidX (androidx.fragment/androidx.core/... — patrz błąd CI:
# ":mapReleaseSourceSetPaths ... Configuration ':releaseRuntimeClasspath'
# contains AndroidX dependencies, but the 'android.useAndroidX' property is
# not enabled"). Bez tego AGP odmawia budowy modułu zależnego od AndroidX.
android.useAndroidX=true
# Nieszkodliwe nawet gdyby żadna zależność go nie potrzebowała (część
# transitywnego drzewa Play Core to bardzo stare wersje androidx.legacy.*,
# które bywają zapisane w starym formacie com.android.support) — Jetifier
# tłumaczy je na AndroidX w locie, jeśli trzeba.
android.enableJetifier=true
